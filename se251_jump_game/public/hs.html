<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>High Scores</title>
  <link rel="stylesheet" href="css/jump.css"> <!-- keep your original styling -->
</head>
<body>
  <main>
    <section id="highScoresPage">
      <h1>High Scores</h1>

      <!-- Scores list -->
      <div id="scores"></div>

      <!-- Save form -->
      <form id="saveForm">
        <label for="name">Enter your initials:</label>
        <input type="text" id="name" required>
        <button type="submit">Save Score</button>
      </form>

      <!-- Back link -->
      <a href="index.html">Back to Start</a>
    </section>
  </main>

  <script>
    // Get score from query string
    const params = new URLSearchParams(window.location.search);
    const score = params.get("score");

    // Handle save form
    document.getElementById("saveForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const name = document.getElementById("name").value;

      fetch("http://localhost:3000/jeep", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, score })
      })
      .then(res => res.json())
      .then(data => {
        alert("Score saved!");
        // ✅ Redirect back to game start
        window.location.href = "index.html?restart=true";
      })
      .catch(err => console.error("Error saving score:", err));
    });

    // Load scores from server
    fetch("http://localhost:3000/jeep")
      .then(res => res.json())
      .then(data => {
        document.getElementById("scores").innerHTML =
          data.map(s => `<p>${s.name}: ${s.score}</p>`).join("");
      })
      .catch(err => console.error("Error loading scores:", err));
  </script>
</body>
</html>
